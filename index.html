<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>英語リスニングプレイヤー</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;font-family:'Segoe UI','Yu Gothic UI',sans-serif;background:#f0f0f0;color:#1a1a1a}
#topbar{width:100%;height:46px;background:#2d2d2d;color:#fff;display:flex;align-items:center;padding:0 14px;gap:10px;position:fixed;top:0;left:0;z-index:10;box-sizing:border-box}
#topbar h1{font-size:14px;font-weight:500;flex:1}
#topbar button{-webkit-app-region:no-drag;pointer-events:all;cursor:pointer}
#topbar span{-webkit-app-region:no-drag}
#fileLabel{font-size:12px;color:#aaa;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bblu{background:#4a90d9;color:#fff;border:none;border-radius:5px;padding:0 14px;height:30px;font-size:12px;cursor:pointer;font-family:inherit;white-space:nowrap}
.bblu:hover{background:#357abd}
#wrap{position:fixed;top:46px;left:0;right:0;bottom:0;overflow:hidden;display:flex;flex-direction:column}
#tabRow{display:none;flex-shrink:0;background:#fff;border-bottom:1px solid #ddd;padding:0 14px}
.tab{padding:8px 18px;font-size:13px;cursor:pointer;border:none;background:none;color:#888;font-family:inherit;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.on{color:#2d2d2d;border-bottom-color:#2d2d2d;font-weight:500}
#hint{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#888;position:relative;z-index:5}
#hint .ico{font-size:48px}
#hint .msg{font-size:15px}
#playerPanel{display:none;flex:1;overflow:hidden;padding:10px 14px;box-sizing:border-box;flex-direction:column;gap:8px}
#favPanel{display:none;flex:1;overflow:hidden;padding:10px 14px;box-sizing:border-box;flex-direction:column;gap:8px}
.fn-btn{width:28px;height:28px;border-radius:5px;border:1px solid #ccc;background:#f5f5f5;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#333}
.fn-btn:hover{background:#e0e0e0}
.fn-btn:disabled{opacity:0.3;cursor:default}
#seekFill{height:100%;background:#4a90d9;border-radius:3px;width:0%}
#timeRow{display:flex;justify-content:space-between;font-size:11px;color:#888;flex-shrink:0}
#controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;flex-shrink:0}
.br{width:40px;height:40px;border-radius:50%;border:1px solid #ccc;background:#fff;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.br:hover{background:#eee}.br:active{transform:scale(.95)}
#btnPlay{width:46px;height:46px;font-size:18px;background:#2d2d2d;color:#fff;border-color:#2d2d2d}
#btnPlay:hover{background:#444}
.bt{height:30px;padding:0 12px;border-radius:5px;border:1px solid #ccc;background:#fff;cursor:pointer;font-size:12px;color:#555;font-family:inherit}
.bt:hover{background:#eee}.bt.on{background:#1D9E75;color:#fff;border-color:#1D9E75}
#btnRep1.on{background:#4a90d9;color:#fff;border-color:#4a90d9}
#btnRep2.on{background:#27ae60;color:#fff;border-color:#27ae60}
#btnRep5.on{background:#e67e22;color:#fff;border-color:#e67e22}
#btnRep10.on{background:#9b59b6;color:#fff;border-color:#9b59b6}
#btnThrough.on{background:#2d2d2d;color:#fff;border-color:#2d2d2d}
#btnPlayFavList.on{background:#e87000!important;color:#fff!important;border-color:#e87000!important}
#modeRow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;flex-shrink:0}
.ml{font-size:12px;color:#666}
.mb{height:26px;padding:0 12px;border-radius:99px;border:1px solid #ccc;background:#fff;cursor:pointer;font-size:12px;color:#666;font-family:inherit}
.mb:hover{background:#eee}.mb.on{background:#4a90d9;color:#fff;border-color:#4a90d9;font-weight:500}
#optRow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px;color:#666;flex-shrink:0}
.og{display:inline-flex;align-items:center;gap:4px}
.og input[type=number]{width:44px;height:26px;border:1px solid #ccc;border-radius:4px;text-align:center;font-size:12px;font-family:inherit}
.og select{height:26px;border:1px solid #ccc;border-radius:4px;font-size:12px;font-family:inherit}
.tbadge{font-size:10px;padding:1px 7px;border-radius:99px;font-weight:500}
.bs{background:#daeeff;color:#1a5fa8}.bp{background:#d6f0d0;color:#2a6e24}.bw{background:#fff0c8;color:#7a5000}
#listHead{display:flex;align-items:center;gap:8px;font-size:12px;color:#666;flex-shrink:0}
#listWrap{flex:1;min-height:0;overflow-y:auto;border:1px solid #ddd;border-radius:6px;background:#fff}
.si{padding:9px 12px;font-size:13px;cursor:pointer;border-bottom:1px solid #f0f0f0;display:flex;align-items:center;gap:8px;color:#1a1a1a;user-select:none}
.si:last-child{border-bottom:none}.si:hover{background:#f7f7f7}
.si.sel{background:#daeeff!important;color:#1a5fa8!important}
.si.play{background:#fff0c8!important;color:#7a5000!important}
.sn{font-size:11px;color:#aaa;min-width:22px;text-align:right;flex-shrink:0}
.st{font-size:11px;color:#aaa;min-width:76px;flex-shrink:0}
.sx{flex:1}.sd{font-size:11px;color:#aaa;min-width:32px;text-align:right;flex-shrink:0}
.sfav{font-size:15px;opacity:0.2;flex-shrink:0;cursor:pointer;color:#ccc;padding:0 2px}
.si:hover .sfav{opacity:0.6}
.si.fav .sfav{color:#e87000;opacity:1;text-shadow:0 0 4px rgba(232,112,0,0.3)}
#statusBar{flex-shrink:0;padding:5px 10px;background:#fff;border-radius:6px;border:1px solid #ddd;font-size:12px;color:#666;display:flex;justify-content:space-between;align-items:center;min-height:30px}
.rb{font-size:11px;padding:2px 10px;border-radius:99px;background:#fff0c8;color:#7a5000;display:none}

/* ---- 要練習パネル ---- */
#favControls{display:flex;align-items:center;gap:8px;flex-shrink:0;flex-wrap:wrap}
#favListWrap{flex:1;min-height:0;overflow-y:auto;border:1px solid #ddd;border-radius:6px;background:#fff}
.fav-empty{padding:40px;text-align:center;color:#aaa;font-size:14px;line-height:2}

/* グループヘッダー */
.fg{padding:8px 12px 4px;font-size:11px;font-weight:600;color:#888;background:#f8f8f8;border-bottom:1px solid #eee;display:flex;align-items:center;gap:6px;position:sticky;top:0;z-index:1}
.fg-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fg-count{font-size:10px;background:#e0e0e0;color:#666;border-radius:99px;padding:1px 7px}

/* 要練習アイテム */
.fi{padding:10px 12px;border-bottom:1px solid #f0f0f0;display:flex;flex-direction:column;gap:5px;cursor:pointer;user-select:none}
.fi:last-child{border-bottom:none}.fi:hover{background:#fafafa}
.fi.play{background:#fff4e0!important}
.fi-top{display:flex;align-items:center;gap:8px}
.fi-play{width:28px;height:28px;border-radius:50%;border:1px solid #ccc;background:#fff;cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.fi-play:hover{background:#eee}
.fi-play.playing{background:#2d2d2d;color:#fff;border-color:#2d2d2d}
.fi-time{font-size:12px;color:#444;font-variant-numeric:tabular-nums;flex-shrink:0}
.fi-dur{font-size:11px;color:#aaa;flex-shrink:0}
.fi-sx{flex:1}
.fi-date{font-size:10px;color:#bbb;flex-shrink:0}
/* 難易度タグ */
.fi-tags{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.diff-tag{font-size:11px;padding:2px 8px;border-radius:99px;cursor:pointer;border:1px solid transparent;font-family:inherit}
.diff-tag.hard{background:#fde8e8;color:#c0392b;border-color:#f5b7b1}
.diff-tag.mid{background:#fef9e7;color:#d68910;border-color:#fad7a0}
.diff-tag.every{background:#eef0ff;color:#3a4abf;border-color:#b3b9f5}
.diff-tag.active{font-weight:600;box-shadow:0 0 0 2px currentColor}
/* メモ */
.fi-memo-row{display:flex;align-items:center;gap:6px}
.fi-memo{font-size:14px;color:#555;flex:1;cursor:text;min-height:18px}
.fi-memo.empty{color:#ccc;font-style:italic;font-size:13px}
.fi-memo-input{font-size:14px;border:1px solid #4a90d9;border-radius:4px;padding:2px 6px;width:100%;font-family:inherit;outline:none}
.fi-del{font-size:12px;color:#ddd;cursor:pointer;border:none;background:none;padding:2px 4px;font-family:inherit;flex-shrink:0}
.fi-del:hover{color:#e24b4a}

#favStatusBar{flex-shrink:0;padding:5px 10px;background:#fff;border-radius:6px;border:1px solid #ddd;font-size:12px;color:#666;min-height:30px;display:flex;align-items:center}
</style>
</head>
<body>
<div id="topbar">
  <h1>🎧 英語リスニングプレイヤー</h1>
  <span id="fileLabel">ファイル未選択</span>
</div>
<div id="wrap">
  <div id="tabRow">
    <button class="tab on" id="tabPlayer">▶ プレイヤー</button>
    <button class="tab" id="tabFav">🟠 要練習 (<span id="favCount">0</span>)</button>
    <button class="tab" id="tabFavHard">🎤 発音</button>
    <button class="tab" id="tabFavMid">👂 リスニング</button>
    <button class="tab" id="tabFavEvery">📅 every day</button>
  </div>
  <div id="hint">
    <div class="ico">🎵</div>
    <div class="msg">音声ファイルを開いてください</div>
    <div style="font-size:12px;color:#aaa">MP3 / WAV / M4A 対応</div>
    <button class="bblu" id="btnOpen" style="margin-top:16px;height:52px;padding:0 40px;font-size:16px;border-radius:8px">📂 ファイルを選択</button>
    <div style="font-size:11px;color:#bbb;margin-top:6px">または メニュー「ファイル」→「音声ファイルを開く」/ Ctrl+O</div>
  </div>
  <div id="playerPanel">
    <div style="display:flex;align-items:center;gap:8px;flex-shrink:0;margin-bottom:2px">
      <button class="bblu" id="btnOpenInPlayer" style="height:28px;font-size:12px;padding:0 12px">📂 別のファイルを開く</button>
      <label style="font-size:12px;color:#666;display:flex;align-items:center;gap:4px;cursor:pointer">
        <input type="checkbox" id="chkCurrentFile" style="cursor:pointer"> ✓ チェック
      </label>
      <span id="fileLabel2" style="font-size:12px;color:#888;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1"></span>
      <select id="checkedFileSelect" style="display:none;height:26px;border:1px solid #ccc;border-radius:4px;font-size:12px;font-family:inherit;max-width:180px">
        <option value="">チェック済み▼</option>
      </select>
      <button class="fn-btn" id="fnPrev" title="前のファイル" style="display:none">◀</button>
      <span id="fnPos" style="display:none;font-size:11px;color:#aaa;white-space:nowrap"></span>
      <button class="fn-btn" id="fnNext" title="次のファイル" style="display:none">▶</button>
    </div>
    <div id="seekBar"><div id="seekFill"></div></div>
    <div id="timeRow"><span id="curTime">0:00</span><span id="totTime">0:00</span></div>
    <div id="controls">
      <button class="br" id="btnPrev">⏮</button>
      <button class="br" id="btnPlay">▶</button>
      <button class="br" id="btnNext">⏭</button>
      <button class="bt on" id="btnRepeat">🔁 リピート</button>
      <button class="bt" id="btnAuto">▶▶ 自動進行</button>
      <button class="bt" id="btnRep1" title="1回再生">1回</button>
      <button class="bt" id="btnRep2" title="2回リピート">2回</button>
      <button class="bt" id="btnRep5" title="5回リピート">5回</button>
      <button class="bt" id="btnRep10" title="10回リピート">10回</button>
      <button class="bt" id="btnThrough" title="ファイルを通しで再生">通し</button>
      <button class="bt" id="btnPlayFavOnly" title="要練習の文だけ再生">★ 要練習再生</button>
      <button class="bt" id="btnFolderPlay" title="フォルダ内を自動連続再生">📂 フォルダ連続</button>
    </div>
    <div id="modeRow">
      <span class="ml">検出モード：</span>
      <button class="mb on" data-m="sentence">文 <span id="starSentence" style="display:none;color:#e87000;font-size:11px">★</span></button>
      <button class="mb" data-m="phrase">熟語・短文 <span id="starPhrase" style="display:none;color:#e87000;font-size:11px">★</span></button>
      <button class="mb" data-m="word">単語 <span id="starWord" style="display:none;color:#e87000;font-size:11px">★</span></button>
    </div>
    <div id="optRow">
      <div class="og"><label>待機</label><input type="number" id="pauseDur" value="1" min="0" max="5" step="0.5"><span>秒</span></div>
      <div class="og"><label>リピート</label><input type="number" id="repCount" value="2" min="1" max="10"><span>回</span></div>
      <div class="og"><label>速度</label>
        <select id="rateEl">
          <option value="0.5">0.5x</option><option value="0.75">0.75x</option>
          <option value="1" selected>1.0x</option><option value="1.25">1.25x</option><option value="1.5">1.5x</option>
        </select>
      </div>
      <div class="og"><label>無音閾値</label><input type="number" id="silThr" value="0.3" min="0.1" max="3" step="0.1"><span>秒</span></div>
      <button class="bt" id="btnRedetect" style="height:26px;font-size:11px">再検出</button>
    </div>
    <div id="listHead">
      <span>検出: <strong id="sentCount">0</strong> 件</span>
      <span id="lgS"><span class="tbadge bs">文</span></span>
      <span id="lgP" style="display:none"><span class="tbadge bp">熟語</span></span>
      <span id="lgW" style="display:none"><span class="tbadge bw">単語</span></span>
      <span id="analyzeStatus" style="color:#aaa;font-size:11px"></span>
    </div>
    <div id="listWrap"></div>
    <div id="statusBar"><span id="statusMsg">準備完了</span><span class="rb" id="repBadge"></span></div>
  </div>
  <div id="favPanel">
    <div id="favControls">
      <button class="bt on" id="btnRepeatFav">🔁 リピート</button>
      <div class="og" style="font-size:12px;color:#666"><label>回数</label><input type="number" id="repCountFav" value="2" min="1" max="10" style="width:44px;height:26px;border:1px solid #ccc;border-radius:4px;text-align:center;font-size:12px;font-family:inherit"><span>回</span></div>
      <button class="bt" id="btnPlayFavList" style="display:none">▶ 連続再生</button>
      <button class="bt" id="btnExport">💾 書き出し</button>
      <button class="bt" id="btnImport">📥 読み込み</button>
      <button class="bt" id="btnExportMp3Hard">🎤 発音MP3</button>
      <button class="bt" id="btnExportMp3Mid">👂 リスニングMP3</button>
      <button class="bt" id="btnExportMp3Every">📅 every dayMP3</button>
      <button class="bt" id="btnOpenFolder">📂 フォルダを開く</button>
      <button class="bt" id="btnClearFav" style="margin-left:auto;color:#e24b4a;border-color:#e24b4a">🗑 全削除</button>
    </div>
    <div id="favListWrap"></div>
    <div id="favStatusBar"><span id="favStatusMsg">要練習リスト</span></div>
  </div>
</div>
<audio id="audioEl" style="display:none"></audio>
<script>
'use strict';
const ge=id=>document.getElementById(id);
const hint=ge('hint'),playerPanel=ge('playerPanel'),favPanel=ge('favPanel');
const tabRow=ge('tabRow'),tabPlayer=ge('tabPlayer'),tabFav=ge('tabFav');
const tabFavHard=ge('tabFavHard'),tabFavMid=ge('tabFavMid'),tabFavEvery=ge('tabFavEvery');
let favFilter='all'; // 'all' | 'hard' | 'mid' | 'every'
const fileLabel=ge('fileLabel');
const btnPlay=ge('btnPlay'),btnPrev=ge('btnPrev'),btnNext=ge('btnNext');
const btnRepeat=ge('btnRepeat'),btnAuto=ge('btnAuto');
const curTimeEl=ge('curTime'),totTimeEl=ge('totTime');
const statusMsg=ge('statusMsg'),repBadge=ge('repBadge');
const sentCount=ge('sentCount'),listWrap=ge('listWrap');
const seekBar=ge('seekBar'),seekFill=ge('seekFill');
const pauseDurEl=ge('pauseDur'),repCountEl=ge('repCount');
const rateEl=ge('rateEl'),silThrEl=ge('silThr'),btnRedetect=ge('btnRedetect');
const audioEl=ge('audioEl'),analyzeStatus=ge('analyzeStatus');
// シーク時のブチっとノイズ対策: WebAudio GainNodeでフェードイン/アウト
let _actx=null,_gain=null,_gainSrc=null;
function getGain(){
  if(_gain) return _gain;
  try{
    _actx=new(window.AudioContext||window.webkitAudioContext)();
    _gainSrc=_actx.createMediaElementSource(audioEl);
    _gain=_actx.createGain();
    _gainSrc.connect(_gain); _gain.connect(_actx.destination);
  }catch(e){_gain=null;}
  return _gain;
}
function fadeIn(dur=0.04){
  const g=getGain(); if(!g) return;
  if(_actx.state==='suspended') _actx.resume();
  g.gain.cancelScheduledValues(_actx.currentTime);
  g.gain.setValueAtTime(0,_actx.currentTime);
  g.gain.linearRampToValueAtTime(1,_actx.currentTime+dur);
}
function fadeOut(cb,dur=0.04){
  const g=getGain();
  if(!g){cb();return;}
  g.gain.cancelScheduledValues(_actx.currentTime);
  g.gain.setValueAtTime(1,_actx.currentTime);
  g.gain.linearRampToValueAtTime(0,_actx.currentTime+dur);
  setTimeout(cb,dur*1000+5);
}
const favListWrap=ge('favListWrap'),favCount=ge('favCount'),favStatusMsg=ge('favStatusMsg');
const btnRepeatFav=ge('btnRepeatFav');

let segs=[],cur=-1,playing=false;
let lastPlayedTime=-1; // モード切替をまたいで再生位置を保持
let repCur=0,repTot=0,repeatOn=true,autoOn=false;
let pTimer=null,mode='sentence';
let audioDuration=0,analyzeBuffer=null,currentFileUrl='',currentFilePath='';
let folderSiblings=[], folderIndex=-1;
let repeatOnFav=true,favCur=-1,favPlaying=false,favPTimer=null;
let lastSavedPath=null;
let favOnlyMode=false;
let favOnlyQueue=[];
let folderPlayMode=false, folderPlayIdx=-1, folderPlayTimer=null, folderSegIdx=0;
// チェック済み音声ファイル管理
let checkedFiles=[];
try{checkedFiles=JSON.parse(localStorage.getItem('eng_checked_files')||'[]');}catch(e){}

// favorites: [{id,fileUrl,filePath,fileName,start,end,label,addedAt,diff,memo}]
let favorites=[];
try{favorites=JSON.parse(localStorage.getItem('eng_fav2')||'[]');}catch(e){}

const fmt=t=>{const m=Math.floor(t/60),s=Math.floor(t%60);return m+':'+String(s).padStart(2,'0')};
const fmtDate=ts=>{const d=new Date(ts);return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`};
const getRate=()=>parseFloat(rateEl.value)||1;
const getPause=()=>parseFloat(pauseDurEl.value)||1;
const getRep=()=>parseInt(repCountEl.value)||2;
const getRepFav=()=>parseInt(ge('repCountFav').value)||2;
const getSil=()=>parseFloat(silThrEl.value)||0.3;
const saveFavs=()=>{try{localStorage.setItem('eng_fav2',JSON.stringify(favorites));}catch(e){}; favCount.textContent=favorites.length; updateModeStars();};

// ---- タブ ----
function showFavPanel(filter){
  favFilter=filter;
  [tabFav,tabFavHard,tabFavMid,tabFavEvery].forEach(t=>t.classList.remove('on'));
  if(filter==='all') tabFav.classList.add('on');
  else if(filter==='hard') tabFavHard.classList.add('on');
  else if(filter==='mid') tabFavMid.classList.add('on');
  else if(filter==='every') tabFavEvery.classList.add('on');
  tabPlayer.classList.remove('on');
  favPanel.style.display='flex'; playerPanel.style.display='none';
  const playBtn=ge('btnPlayFavList');
  if(filter==='hard'||filter==='mid'||filter==='every'){
    const label=filter==='hard'?'🎤 発音':filter==='mid'?'👂 リスニング':'📅 every day';
    playBtn.textContent=`▶ ${label}を連続再生`;
    playBtn.style.display='';
  } else {
    playBtn.style.display='none';
  }
  renderFavList();
  // 現在開いているファイルの要練習項目へスクロール
  setTimeout(()=>scrollToCurrentFileFav(), 50);
}

function scrollToCurrentFileFav(){
  if(!currentFilePath && !currentFileUrl) return;
  const items=favListWrap.querySelectorAll('.fi');
  for(const item of items){
    const idx=parseInt(item.dataset.idx);
    if(isNaN(idx)) continue;
    const f=favorites[idx];
    if(f && isSameFile(f)){
      item.scrollIntoView({block:'center'});
      // 一瞬ハイライトして場所をわかりやすく
      item.style.background='#fffbcc';
      setTimeout(()=>{ item.style.background=''; }, 1000);
      break;
    }
  }
}
tabPlayer.onclick=()=>{
  [tabFav,tabFavHard,tabFavMid,tabFavEvery].forEach(t=>t.classList.remove('on'));
  tabPlayer.classList.add('on');
  favPanel.style.display='none'; playerPanel.style.display='flex';
  stopFav();
  if(currentFileUrl){ audioEl.src=currentFileUrl; }
};
tabFav.onclick=()=>showFavPanel('all');
tabFavHard.onclick=()=>showFavPanel('hard');
tabFavMid.onclick=()=>showFavPanel('mid');
tabFavEvery.onclick=()=>showFavPanel('every');

function loadAudio(fileUrl,fileName){
  // 前のファイルをクリア（メモリ解放）
  audioEl.pause();
  audioEl.removeAttribute('src');
  audioEl.load();
  currentFileUrl=fileUrl; fileLabel.textContent=fileName;
  const fl2=ge('fileLabel2'); if(fl2) fl2.textContent=fileName;
  audioEl.src=fileUrl;
  hint.style.display='none';
  tabRow.style.display='flex';
  playerPanel.style.display='flex';
  favPanel.style.display='none';
  tabPlayer.classList.add('on'); tabFav.classList.remove('on');
  statusMsg.textContent=fileName+' を読み込み中...'; analyzeStatus.textContent='解析中...';
  segs=[]; cur=-1; analyzeBuffer=null; lastPlayedTime=0; renderList();
  // ファイル切替時は必ず先頭をハイライト（applyMode完了後）
  audioEl.onloadedmetadata=()=>{
    if(audioEl.duration&&audioEl.duration!==Infinity){
      audioDuration=audioEl.duration; totTimeEl.textContent=fmt(audioDuration);
      statusMsg.textContent=fileName+' を読み込みました';
      if(currentFilePath) scheduleAnalyze(fileUrl); else analyzeStatus.textContent='';
    }
  };
  audioEl.onerror=()=>{statusMsg.textContent='再生エラー';};
}

// ---- ffmpeg解析 ----
async function scheduleAnalyze(fileUrl){
  analyzeStatus.textContent='ffmpegで解析中...';
  try{
    const r=await window.api.detectSilence(currentFilePath,-30,getSil());
    if(!r.ok){analyzeStatus.textContent='ffmpegエラー';return;}
    if(r.totalDuration&&r.totalDuration>audioDuration){audioDuration=r.totalDuration;totTimeEl.textContent=fmt(audioDuration);}
    // 生の無音区間データを保存（モード切替時に再利用）
    analyzeBuffer={_silenceData:r, _filePath:currentFilePath};
    analyzeStatus.textContent='';
    applyMode();
  }catch(e){analyzeStatus.textContent='（解析エラー）';}
}

function buildSegsFromSilence(r, thr, minLen){
  // ffmpegの結果を使って任意の閾値でセグメントを再構築
  const segments=r.segments||[];
  // 元々のセグメントは既に無音を除いた発話区間
  // minLen以上のものだけ返す
  return segments.filter(s=>(s.end-s.start)>=minLen);
}

function updateLegend(){
  ge('lgS').style.display=mode==='sentence'||mode==='all'?'':'none';
  ge('lgP').style.display=mode==='phrase'||mode==='all'?'':'none';
  ge('lgW').style.display=mode==='word'||mode==='all'?'':'none';
}

function applyMode(){
  if(!analyzeBuffer||!analyzeBuffer._filePath) return;
  updateLegend();
  if(mode==='sentence'){
    // sentence用データはキャッシュを使う
    const r=analyzeBuffer._silenceData;
    if(!r) return;
    const s=mergeShortSegs(r.segments.filter(x=>(x.end-x.start)>=0.2).map(x=>({...x,type:'sentence'})),1.0);
    segs=s; sentCount.textContent=segs.length;
    statusMsg.textContent=segs.length+'個の区間を検出しました'; renderList();
  } else if(mode==='phrase'){
    statusMsg.textContent='熟語・短文を検出中...';
    // phraseは0.15秒の無音で区切る（固定値）
    window.api.detectSilence(analyzeBuffer._filePath,-30,0.15)
      .then(r2=>{
        if(!r2.ok){statusMsg.textContent='検出エラー';return;}
        segs=r2.segments.filter(x=>(x.end-x.start)>=0.1).map(x=>({...x,type:'phrase'}));
        sentCount.textContent=segs.length;
        statusMsg.textContent=segs.length+'個の区間を検出しました'; renderList();
      });
  } else if(mode==='word'){
    statusMsg.textContent='単語を検出中...';
    // wordは0.05秒の無音で区切る（固定値）
    window.api.detectSilence(analyzeBuffer._filePath,-30,0.05)
      .then(r2=>{
        if(!r2.ok){statusMsg.textContent='検出エラー';return;}
        segs=r2.segments.filter(x=>(x.end-x.start)>=0.05).map(x=>({...x,type:'word'}));
        sentCount.textContent=segs.length;
        statusMsg.textContent=segs.length+'個の区間を検出しました'; renderList();
      });
  } else if(mode==='all'){
    statusMsg.textContent='全モードを検出中...';
    const p1=window.api.detectSilence(analyzeBuffer._filePath,-30,getSil());
    const p2=window.api.detectSilence(analyzeBuffer._filePath,-30,0.15);
    const p3=window.api.detectSilence(analyzeBuffer._filePath,-30,0.05);
    Promise.all([p1,p2,p3]).then(([r1,r2,r3])=>{
      const all=[
        ...(r1.ok?mergeShortSegs(r1.segments.filter(x=>(x.end-x.start)>=0.2).map(x=>({...x,type:'sentence'})),1.0):[]),
        ...(r2.ok?r2.segments.filter(x=>(x.end-x.start)>=0.1).map(x=>({...x,type:'phrase'})):[]),
        ...(r3.ok?r3.segments.filter(x=>(x.end-x.start)>=0.05).map(x=>({...x,type:'word'})):[])
      ].sort((a,b)=>a.start-b.start);
      // 開始時刻が0.1秒以内の重複を除去（より長いものを優先）
      const m=[];
      all.forEach(x=>{
        if(!m.length){m.push(x);return;}
        const l=m[m.length-1];
        if(Math.abs(x.start-l.start)<0.1){
          // より長いセグメントを残す
          if((x.end-x.start)>(l.end-l.start)) m[m.length-1]=x;
        } else {
          m.push(x);
        }
      });
      segs=m; sentCount.textContent=segs.length;
      statusMsg.textContent=segs.length+'個の区間を検出しました'; renderList();
    });
  }
}

// ---- 検出 ----
// 1秒以下の短いセグメントを次のセグメントにくっつける
function mergeShortSegs(segs, thresh){
  if(!segs.length) return segs;
  // まず前→次方向に結合（短いセグメントを次へ吸収）
  const fwd=[];
  let cur=null;
  for(let i=0;i<segs.length;i++){
    const s=segs[i];
    cur = cur ? {...cur, end:s.end} : {...s};
    const isLast = i===segs.length-1;
    if((cur.end - cur.start) > thresh || isLast){
      fwd.push(cur); cur=null;
    }
  }
  // 最後のセグメントがまだ短ければ前に結合
  if(fwd.length>=2 && (fwd[fwd.length-1].end - fwd[fwd.length-1].start) <= thresh){
    const last=fwd.pop();
    fwd[fwd.length-1]={...fwd[fwd.length-1], end:last.end};
  }
  return fwd;
}
function detectWith(thr,minLen){
  if(!analyzeBuffer)return[];
  const ch=analyzeBuffer.getChannelData(0),sr=analyzeBuffer.sampleRate;
  const ws=Math.floor(sr*.03),sil=Math.floor(sr*thr),minS=Math.floor(sr*minLen);
  let sc=0,inS=false,ss=0;const out=[];
  for(let i=0;i<ch.length;i+=ws){let rms=0;for(let j=i;j<Math.min(i+ws,ch.length);j++)rms+=ch[j]*ch[j];rms=Math.sqrt(rms/ws);if(rms>.01){if(!inS){inS=true;ss=i;}sc=0;}else{if(inS)sc+=ws;if(inS&&sc>=sil){const e=i-sil;if(e-ss>=minS)out.push({start:ss/sr,end:e/sr});inS=false;sc=0;}}}
  if(inS)out.push({start:ss/sr,end:ch.length/sr});return out;
}
function detect(){
  if(analyzeBuffer&&analyzeBuffer._silenceData){
    ge('lgS').style.display=mode==='sentence'||mode==='all'?'':'none';
    ge('lgP').style.display=mode==='phrase'||mode==='all'?'':'none';
    ge('lgW').style.display=mode==='word'||mode==='all'?'':'none';
    applyMode();
  } else if(analyzeBuffer&&analyzeBuffer.getChannelData){
    let s=[];
    if(mode==='sentence') s=mergeShortSegs(detectWith(getSil(),.5).map(x=>({...x,type:'sentence'})),1.0);
    else if(mode==='phrase') s=detectWith(Math.min(getSil(),.25),.3).map(x=>({...x,type:'phrase'}));
    else if(mode==='word') s=detectWith(Math.min(getSil(),.1),.05).map(x=>({...x,type:'word'}));
    else{const all=[...mergeShortSegs(detectWith(getSil(),.5).map(x=>({...x,type:'sentence'})),1.0),...detectWith(Math.min(getSil(),.25),.3).map(x=>({...x,type:'phrase'})),...detectWith(Math.min(getSil(),.1),.05).map(x=>({...x,type:'word'}))].sort((a,b)=>a.start-b.start);const m=[];all.forEach(x=>{if(!m.length){m.push(x);return;}const l=m[m.length-1];if(Math.abs(x.start-l.start)<.05&&Math.abs(x.end-l.end)<.05)return;m.push(x);});s=m;}
    segs=s;
    sentCount.textContent=segs.length;
    ge('lgS').style.display=mode==='sentence'||mode==='all'?'':'none';
    ge('lgP').style.display=mode==='phrase'||mode==='all'?'':'none';
    ge('lgW').style.display=mode==='word'||mode==='all'?'':'none';
    statusMsg.textContent=segs.length+'個の区間を検出しました'; renderList();
  }
}

// ★ 要練習チェック - filePathまたはfileUrlで照合
function isSameFile(f){
  return (currentFileUrl && f.fileUrl===currentFileUrl) ||
         (currentFilePath && f.filePath===currentFilePath);
}
function isFav(i){
  const s=segs[i];if(!s)return false;
  return favorites.some(f=>
    isSameFile(f) &&
    Math.abs(f.start-s.start)<0.5 &&
    // segTypeが保存されていればそのタイプと一致する時だけ★
    (!f.segType || f.segType===s.type)
  );
}
function getFavItem(i){
  const s=segs[i];if(!s)return null;
  return favorites.find(f=>
    isSameFile(f) &&
    Math.abs(f.start-s.start)<0.5 &&
    (!f.segType || f.segType===s.type)
  )||null;
}
function renderList(){
  listWrap.innerHTML='';
  segs.forEach((s,i)=>{
    const d=document.createElement('div');
    const fav=isFav(i);
    const favItem=fav?getFavItem(i):null;
    d.className='si'+(i===cur?(playing?' play':' sel'):'')+(fav?' fav':'');
    const bc=s.type==='sentence'?'bs':s.type==='phrase'?'bp':'bw';
    const bl=s.type==='sentence'?'文':s.type==='phrase'?'熟語':'単語';
    // 要練習のタグを表示
    const starStyle=fav?'color:#e87000;opacity:1':'';
    d.innerHTML=`<span class="sn">${i+1}</span><span class="tbadge ${bc}">${bl}</span><span class="st">${fmt(s.start)}–${fmt(s.end)}</span><span class="sx"></span><span class="sd">${(s.end-s.start).toFixed(1)}s</span><span class="sfav" title="要練習に登録" style="${starStyle}">★</span>`;
    d.querySelector('.sfav').onclick=e=>{e.stopPropagation();toggleFav(i);};
    d.onclick=()=>playSeg(i,1);
    listWrap.appendChild(d);
  });
  // モード切替後に最後に再生した位置に近い文をマーク＆スクロール
  if(cur===-1){
    let nearest=0; // デフォルトは先頭
    if(lastPlayedTime>0){
      let minDist=Infinity;
      segs.forEach((s,i)=>{
        const dist=Math.abs(s.start-lastPlayedTime);
        if(dist<minDist){minDist=dist;nearest=i;}
      });
    }
    if(segs.length>0){
      cur=nearest;
      const items=listWrap.querySelectorAll('.si');
      if(items[nearest]){
        items[nearest].classList.add('sel');
        items[nearest].scrollIntoView({block:'center'});
      }
    }
  }
  updateModeStars();
}
function hilite(){
  const items=listWrap.querySelectorAll('.si');
  items.forEach((el,i)=>{el.classList.remove('sel','play');if(i===cur)el.classList.add(playing?'play':'sel');});
  if(cur>=0&&items[cur])items[cur].scrollIntoView({block:'nearest'});
}

// ---- 要練習管理 ----
function toggleFav(i){
  const s=segs[i];if(!s)return;
  const idx=favorites.findIndex(f=>isSameFile(f)&&Math.abs(f.start-s.start)<0.5);
  if(idx>=0){favorites.splice(idx,1);}
  else{favorites.push({id:Date.now(),fileUrl:currentFileUrl,filePath:currentFilePath,fileName:fileLabel.textContent,start:s.start,end:s.end,label:fmt(s.start)+'–'+fmt(s.end),addedAt:Date.now(),diff:'',memo:'',segType:s.type||mode});}
  saveFavs(); renderList();
}

function renderFavList(){
  favListWrap.innerHTML='';
  // favFilterでフィルタリング
  const filtered = favFilter==='all'
    ? favorites.map((f,i)=>({f,i}))
    : favorites.map((f,i)=>({f,i})).filter(({f})=>f.diff===favFilter);

  if(!filtered.length){
    const msg = favFilter==='hard'?'🎤 発音タグの文がありません'
              : favFilter==='mid'?'👂 リスニングタグの文がありません'
              : favFilter==='every'?'📅 every dayタグの文がありません'
              : '🟠 要練習はまだありません<br>プレイヤーで文の ★ を押して登録できます';
    favListWrap.innerHTML=`<div class="fav-empty">${msg}</div>`;
    return;
  }
  // ファイル名でグループ化
  const groups={};
  filtered.forEach(({f,i})=>{
    if(!groups[f.fileName]) groups[f.fileName]=[];
    groups[f.fileName].push({f,i});
  });
  Object.keys(groups).forEach(name=>{
    const grp=groups[name];
    const gh=document.createElement('div');
    gh.className='fg';
    gh.innerHTML=`<span>🎵</span><span class="fg-name">${name}</span><span class="fg-count">${grp.length}件</span>`;
    favListWrap.appendChild(gh);
    grp.forEach(({f,i})=>{
      const d=document.createElement('div');
      d.className='fi'+(i===favCur&&favPlaying?' play':'');
      d.dataset.idx=i;
      // 継続タグを削除（hard/mid/everyのみ）
      const diffLabels={hard:'🎤 発音',mid:'👂 リスニング',every:'📅 every day'};
      const diffHtml=['hard','mid','every'].map(k=>`<span class="diff-tag ${k}${f.diff===k?' active':''}" data-diff="${k}">${diffLabels[k]}</span>`).join('');
      const memoHtml=f.memo?`<span class="fi-memo">${f.memo}</span>`:`<span class="fi-memo empty">メモを追加...</span>`;
      d.innerHTML=`
        <div class="fi-top">
          <button class="fi-play${i===favCur&&favPlaying?' playing':''}">▶</button>
          <span class="fi-time">${f.label}</span>
          <span class="fi-dur">${(f.end-f.start).toFixed(1)}s</span>
          <span class="fi-sx"></span>
          <span class="fi-date">${fmtDate(f.addedAt)}</span>
          <button class="fi-del" title="削除">✕</button>
        </div>
        <div class="fi-tags">${diffHtml}</div>
        <div class="fi-memo-row">${memoHtml}</div>`;

      // 再生
      d.querySelector('.fi-play').onclick=e=>{e.stopPropagation();playFav(i,1);};
      d.onclick=()=>playFav(i,1);

      // タグ切り替え
      d.querySelectorAll('.diff-tag').forEach(tag=>{
        tag.onclick=e=>{
          e.stopPropagation();
          const k=tag.dataset.diff;
          favorites[i].diff = favorites[i].diff===k?'':k;
          saveFavs(); renderFavList();
        };
      });

      // メモ編集
      const memoEl=d.querySelector('.fi-memo');
      memoEl.onclick=e=>{
        e.stopPropagation();
        const inp=document.createElement('input');
        inp.className='fi-memo-input';
        inp.value=favorites[i].memo||'';
        inp.placeholder='メモを入力...';
        memoEl.replaceWith(inp);
        inp.focus();
        const save=()=>{favorites[i].memo=inp.value;saveFavs();renderFavList();};
        inp.onblur=save;
        inp.onkeydown=e=>{if(e.key==='Enter')inp.blur();if(e.key==='Escape'){inp.value=favorites[i].memo||'';inp.blur();}};
      };

      // 削除
      d.querySelector('.fi-del').onclick=e=>{e.stopPropagation();favorites.splice(i,1);saveFavs();stopFav();renderFavList();};

      favListWrap.appendChild(d);
    });
  });
}

function stopFav(){
  audioEl.pause();
  if(favPTimer){clearTimeout(favPTimer);favPTimer=null;}
  favPlaying=false;
  const btn=ge('btnPlayFavList');
  if(btn) btn.classList.remove('on');
}
function playFav(idx,repN){
  stopAll();stopFav();
  const f=favorites[idx];if(!f)return;
  favCur=idx;
  if(audioEl.src!==f.fileUrl) audioEl.src=f.fileUrl;
  const rate=getRate();
  audioEl.playbackRate=rate;
  audioEl.currentTime=f.start;
  favPlaying=true; hiliteFav();
  favStatusMsg.textContent=`再生中: ${f.fileName}  ${f.label}  ${f.diff==='hard'?'🎤発音':f.diff==='mid'?'👂リスニング':f.diff==='every'?'📅every day':''}`;
  const dur=(f.end-f.start)/rate*1000;
  const _fp=audioEl.play();
  const _ft=()=>{fadeIn();favPTimer=setTimeout(()=>{
    fadeOut(()=>{audioEl.pause();favPlaying=false;hiliteFav();
    if(repeatOnFav&&repN<getRepFav()){favPTimer=setTimeout(()=>playFav(idx,repN+1),getPause()*1000);favStatusMsg.textContent=getPause()+'秒後に再リピート...';}
    else{ favStatusMsg.textContent='再生終了'; }
    });
  },dur);};
  if(_fp&&typeof _fp.then==='function'){_fp.then(_ft).catch(()=>{favPlaying=false;hiliteFav();});}else{_ft();}
}
btnRepeatFav.onclick=()=>{repeatOnFav=!repeatOnFav;btnRepeatFav.classList.toggle('on',repeatOnFav);};

// ★ 要練習のみ再生（プレイヤー側）
ge('btnPlayFavOnly').onclick=async()=>{
  if(!currentFilePath){statusMsg.textContent='ファイルが開かれていません';return;}
  const btn=ge('btnPlayFavOnly');

    btn.classList.remove('on');

    return;
  }
  // 要練習に登録されている文（現在ファイルのみ）をstart順にソート
  const favItems=favorites
    .filter(f=>isSameFile(f))
    .sort((a,b)=>a.start-b.start);
  if(!favItems.length){statusMsg.textContent='このファイルに要練習登録がありません';return;}

  // favItemsのstart/endをそのまま使って再生（ffmpeg再検出不要）
  btn.classList.add('on');
  statusMsg.textContent=`★ 要練習再生: ${favItems.length}件`;

let favOnlyTimer=null;
function playFavOnlySegs(list,idx,btn){
  if(!btn.classList.contains('on')) return;
  if(idx>=list.length){
    btn.classList.remove('on');
    audioEl.pause(); playing=false; btnPlay.textContent='▶';
    statusMsg.textContent='★ 要練習再生 完了'; return;
  }
  const f=list[idx];
  const rate=getRate();
  // 前のタイマーを全てクリアしてから再生
  if(favOnlyTimer){clearTimeout(favOnlyTimer);favOnlyTimer=null;}
  audioEl.pause();
  if(pTimer){clearTimeout(pTimer);pTimer=null;}
  playing=false;

  const si=segs.findIndex(seg=>Math.abs(seg.start-f.start)<0.5);
  if(si>=0){cur=si;hilite();}

  const repCount=repeatOn?getRep():1;
  const durMs=(f.end-f.start)/rate*1000;

  function startPlay(rep){
    if(!btn.classList.contains('on')) return;
    audioEl.playbackRate=rate;
    audioEl.currentTime=f.start;
    playing=true; btnPlay.textContent='⏸';
    statusMsg.textContent=`★ 要練習再生 (${idx+1}/${list.length}) [${rep}/${repCount}]`;
    const _p=audioEl.play();
    const _t=()=>{fadeIn();favOnlyTimer=setTimeout(()=>{
      fadeOut(()=>{
      audioEl.pause(); playing=false; btnPlay.textContent='▶';
      if(rep<repCount){
        favOnlyTimer=setTimeout(()=>startPlay(rep+1), getPause()*1000);
      } else {
        favOnlyTimer=setTimeout(()=>playFavOnlySegs(list,idx+1,btn), getPause()*1000);
      }
      });
    }, durMs);};
    if(_p&&typeof _p.then==='function'){_p.then(_t).catch(()=>{playing=false;btnPlay.textContent='▶';});}else{_t();}
  }
  // 少し待ってから再生（前の音声が確実に止まるまで）
  favOnlyTimer=setTimeout(()=>startPlay(1), 80);
}

// 連続再生（発音/リスニング/every dayタブ専用）
let favListPlaying=false;
ge('btnPlayFavList').onclick=()=>{
  if(favListPlaying){
    // 停止
    favListPlaying=false;
    audioEl.pause();
    if(favPTimer){clearTimeout(favPTimer);favPTimer=null;}
    favPlaying=false;
    ge('btnPlayFavList').classList.remove('on');
    favStatusMsg.textContent='連続再生を停止しました';
    return;
  }
  const filtered=favorites.filter(f=>f.diff===favFilter&&(f.filePath||f.fileUrl));
  if(!filtered.length){favStatusMsg.textContent='再生できる文がありません';return;}
  // 通常の要練習再生を止める
  audioEl.pause();
  if(favPTimer){clearTimeout(favPTimer);favPTimer=null;}
  favPlaying=false;
  favListPlaying=true;
  ge('btnPlayFavList').classList.add('on');
  const label=favFilter==='hard'?'🎤 発音':favFilter==='mid'?'👂 リスニング':'📅 every day';
  favStatusMsg.textContent=`${label} 連続再生: ${filtered.length}件`;
  playFavQueue(filtered,0,1);
};

function playFavQueue(queue, idx, repN){
  if(!favListPlaying) return;
  if(idx>=queue.length){
    favListPlaying=false;
    favPlaying=false; hiliteFav();
    ge('btnPlayFavList').classList.remove('on');
    favStatusMsg.textContent='連続再生 完了';
    return;
  }
  const f=queue[idx];
  const favIdx=favorites.indexOf(f);
  if(favIdx<0){playFavQueue(queue,idx+1,1);return;}

  // 前の再生を止める（stopFavは呼ばない）
  audioEl.pause();
  if(favPTimer){clearTimeout(favPTimer);favPTimer=null;}

  favCur=favIdx;
  const fu=f.fileUrl||(f.filePath?('file:///'+f.filePath.replace(/\\/g,'/').split('/').map(s=>encodeURIComponent(s)).join('/')):null);
  if(!fu){playFavQueue(queue,idx+1,1);return;}
  if(audioEl.src!==fu) audioEl.src=fu;
  const rate=getRate();
  audioEl.playbackRate=rate;
  audioEl.currentTime=f.start;
  favPlaying=true; hiliteFav();
  const repTot=repeatOnFav?getRepFav():1;
  favStatusMsg.textContent=`再生中 (${idx+1}/${queue.length}): ${f.fileName} ${f.label} [${repN}/${repTot}]`;

  const durMs=(f.end-f.start)/rate*1000;
  const _fqp=audioEl.play();
  const _fqt=()=>{fadeIn();favPTimer=setTimeout(()=>{
    if(!favListPlaying) return;
    fadeOut(()=>{
    audioEl.pause();
    if(repN<repTot){
      favStatusMsg.textContent=`${getPause()}秒後に再リピート...`;
      favPTimer=setTimeout(()=>playFavQueue(queue,idx,repN+1),getPause()*1000);
    } else {
      favPTimer=setTimeout(()=>playFavQueue(queue,idx+1,1),getPause()*1000);
    }
    });
  },durMs);};
  if(_fqp&&typeof _fqp.then==='function'){_fqp.then(_fqt).catch(()=>{favPlaying=false;hiliteFav();});}else{_fqt();}
}
ge('btnClearFav').onclick=()=>{if(confirm('要練習を全て削除しますか？')){favorites=[];saveFavs();stopFav();renderFavList();}};

// MP3書き出し共通関数
async function exportMp3ByDiff(diffKey, label){
  if(!favorites.length){favStatusMsg.textContent='要練習データがありません';return;}
  const targets = diffKey
    ? favorites.filter(f=>f.filePath && f.diff===diffKey)
    : favorites.filter(f=>f.filePath);
  if(!targets.length){favStatusMsg.textContent=`「${label}」タグの文がありません`;return;}
  favStatusMsg.textContent='フォルダを選択してください...';
  const items=targets.map((f,i)=>{
    const base=f.fileName.replace(/\.[^.]+$/,'');
    const timeStr=f.label.replace(/:/g,'').replace('–','-');
    return {
      filePath:f.filePath, start:f.start, end:f.end,
      outName:`${String(i+1).padStart(3,'0')}_${base}_${timeStr}`
    };
  });
  if(!window.api||!window.api.exportMp3){favStatusMsg.textContent='MP3書き出し非対応';return;}
  const r=await window.api.exportMp3(items);
  if(!r.ok){favStatusMsg.textContent='キャンセルしました';return;}
  const ok=r.results.filter(x=>x.ok).length;
  const ng=r.results.filter(x=>!x.ok).length;
  lastSavedPath=r.outDir;
  favStatusMsg.textContent=`${label} MP3書き出し完了: ${ok}件成功${ng?` / ${ng}件失敗`:''}  →  ${r.outDir}`;
}
ge('btnExportMp3Hard').onclick=()=>exportMp3ByDiff('hard','🎤 発音');
ge('btnExportMp3Mid').onclick=()=>exportMp3ByDiff('mid','👂 リスニング');
ge('btnExportMp3Every').onclick=()=>exportMp3ByDiff('every','📅 every day');

// ---- メイン再生 ----
function stopAll(){audioEl.pause();if(pTimer){clearTimeout(pTimer);pTimer=null;}playing=false;}
function playSeg(idx,repN){
  stopFav();if(!audioDuration||!segs.length)return;stopAll();
  cur=idx;repCur=repN;repTot=repeatOn?getRep():1;
  repBadge.textContent=repCur+' / '+repTot; repBadge.style.display=repTot>1?'':'none';
  const s=segs[idx],rate=getRate();
  lastPlayedTime=s.start; // 再生位置を記録
  audioEl.playbackRate=rate; audioEl.currentTime=s.start;
  playing=true; btnPlay.textContent='⏸'; hilite();
  statusMsg.textContent=`再生中: ${idx+1}番目 (${repCur}/${repTot})`;
  const dur=(s.end-s.start)/rate*1000;
  // play() は非同期なので、実際に再生が始まった時点からタイマーをスタートする
  // これにより初回再生時の冒頭の音切れを防ぐ
  const playPromise=audioEl.play();
  const startTimer=()=>{
    fadeIn();
    pTimer=setTimeout(()=>{
      fadeOut(()=>{
        audioEl.pause();playing=false;btnPlay.textContent='▶';hilite();
        if(repCur<repTot){statusMsg.textContent=getPause()+'秒後に再リピート...';pTimer=setTimeout(()=>playSeg(idx,repCur+1),getPause()*1000);}
        else if(autoOn){const next=idx+1<segs.length?idx+1:0;pTimer=setTimeout(()=>playSeg(next,1),getPause()*1000);}
        else{statusMsg.textContent=`${idx+1}番目 終了`;repBadge.style.display='none';}
      });
    },dur);
  };
  if(playPromise&&typeof playPromise.then==='function'){
    playPromise.then(startTimer).catch(()=>{playing=false;btnPlay.textContent='▶';});
  }else{
    startTimer();
  }
}
btnPlay.onclick=()=>{
  const dur=audioDuration||audioEl.duration;if(!dur&&!audioEl.src)return;
  // 通し再生中なら停止
  const throughBtn=ge('btnThrough');
  if(throughBtn.classList.contains('on')){
    throughBtn.classList.remove('on');
    audioEl.pause(); audioEl.onended=null;
    btnPlay.textContent='▶'; statusMsg.textContent='通し再生を停止しました';
    return;
  }
  if(playing){stopAll();btnPlay.textContent='▶';statusMsg.textContent='一時停止';hilite();}
  else{if(segs.length)playSeg(cur<0?0:cur,1);else{audioEl.playbackRate=getRate();audioEl.play();playing=true;btnPlay.textContent='⏸';}}
};
btnPrev.onclick=()=>{if(segs.length)playSeg(Math.max(0,cur<=0?0:cur-1),1);};
btnNext.onclick=()=>{if(segs.length)playSeg(Math.min(segs.length-1,cur+1),1);};
btnRepeat.onclick=()=>{repeatOn=!repeatOn;btnRepeat.classList.toggle('on',repeatOn);};
btnAuto.onclick=()=>{autoOn=!autoOn;btnAuto.classList.toggle('on',autoOn);};

// 通し再生
ge('btnThrough').onclick=()=>{
  const btn=ge('btnThrough');
  if(btn.classList.contains('on')){
    btn.classList.remove('on');
    audioEl.pause();
    audioEl.onended=null;
    btnPlay.textContent='▶';
    statusMsg.textContent='通し再生を停止しました';
    return;
  }
  if(!currentFileUrl){statusMsg.textContent='ファイルが開かれていません';return;}
  stopAll();
  btn.classList.add('on');

  function startThrough(){
    if(!btn.classList.contains('on')) return;
    audioEl.src=currentFileUrl;
    audioEl.playbackRate=getRate();
    audioEl.currentTime=0;
    audioEl.play();
    btnPlay.textContent='⏸';
    statusMsg.textContent='通し再生中... もう一度押すと停止';
    audioEl.onended=()=>{
      if(!btn.classList.contains('on')) return;
      // 最初に戻ってループ
      statusMsg.textContent='通し再生 ループ中...';
      setTimeout(startThrough, 500);
    };
  }
  startThrough();
};

// 📂 フォルダ連続再生
ge('btnFolderPlay').onclick=()=>{
  if(folderPlayMode){
    folderPlayMode=false;
    if(folderPlayTimer){clearTimeout(folderPlayTimer);folderPlayTimer=null;}
    ge('btnFolderPlay').classList.remove('on');
    stopAll();
    saveFolderProgress();
    statusMsg.textContent='フォルダ連続再生を停止しました';
    return;
  }
  if(!folderSiblings.length){statusMsg.textContent='フォルダのファイルが読み込まれていません';return;}

  // 前回の進捗を確認
  let startIdx=folderIndex>=0?folderIndex:0;
  let startSegIdx=0;
  try{
    const fp=JSON.parse(localStorage.getItem('eng_folder_progress')||'null');
    if(fp&&fp.siblings&&fp.siblings.length){
      const curFolder=folderSiblings[0].replace(/[^/\\]+$/,'');
      if(fp.folderKey===curFolder && (fp.fileIdx>startIdx||(fp.fileIdx===startIdx&&fp.segIdx>0))){
        const msg=fp.segIdx>0
          ?`前回の続き（${fp.fileIdx+1}番目ファイル・${fp.segIdx+1}番目の文）から再生しますか？`
          :`前回の続き（${fp.fileIdx+1}番目）から再生しますか？`;
        if(confirm(msg+'\nキャンセルで最初から')){
          startIdx=fp.fileIdx;
          startSegIdx=fp.segIdx||0;
        }
      }
    }
  }catch(e){}

  folderPlayMode=true;
  ge('btnFolderPlay').classList.add('on');
  folderPlayIdx=startIdx;
  folderSegIdx=startSegIdx;
  statusMsg.textContent=`フォルダ連続再生開始: ${folderPlayIdx+1}/${folderSiblings.length}ファイル目から`;
  startFolderPlayFile();
};

function startFolderPlayFile(){
  if(!folderPlayMode) return;
  if(folderPlayIdx>=folderSiblings.length){
    folderPlayMode=false;
    ge('btnFolderPlay').classList.remove('on');
    statusMsg.textContent='フォルダ連続再生 完了';
    // 進捗をリセット
    try{localStorage.removeItem('eng_folder_progress');}catch(e){}
    return;
  }
  saveFolderProgress();
  if(window.api) window.api.openSibling(folderSiblings[folderPlayIdx]);
}

function onFolderFileReady(){
  if(!folderPlayMode) return;
  if(!segs.length){
    folderPlayTimer=setTimeout(onFolderFileReady, 800);
    return;
  }
  // 同じファイルの途中から再開する場合はfolderSegIdxを使う
  // 別ファイルに移った場合は0から
  const startSeg = folderSegIdx > 0 && folderSegIdx < segs.length ? folderSegIdx : 0;
  folderSegIdx = startSeg;
  statusMsg.textContent=`フォルダ連続再生 (${folderPlayIdx+1}/${folderSiblings.length}) ${startSeg>0?'文'+( startSeg+1)+'から':''}`;
  playNextFolderSeg();
}
function playNextFolderSeg(){
  if(!folderPlayMode) return;
  if(folderSegIdx>=segs.length){
    // このファイル終了→次のファイルへ
    folderPlayIdx++;
    folderSegIdx=0; // 次ファイルは先頭から
    saveFolderProgress();
    folderPlayTimer=setTimeout(startFolderPlayFile, getPause()*1000);
    return;
  }
  // playSeg を使わず直接再生（競合防止）
  stopAll();
  const s=segs[folderSegIdx];
  const rate=getRate();
  cur=folderSegIdx;
  hilite();
  audioEl.playbackRate=rate;
  audioEl.currentTime=s.start;
  playing=true; btnPlay.textContent='⏸';
  const durMs=(s.end-s.start)/rate*1000;
  const _np=audioEl.play();
  const _nt=()=>{fadeIn();folderPlayTimer=setTimeout(()=>{
    if(!folderPlayMode) return;
    fadeOut(()=>{
    audioEl.pause();
    playing=false; btnPlay.textContent='▶';
    folderSegIdx++;
    folderPlayTimer=setTimeout(playNextFolderSeg, getPause()*1000);
    });
  }, durMs);};
  if(_np&&typeof _np.then==='function'){_np.then(_nt).catch(()=>{playing=false;btnPlay.textContent='▶';});}else{_nt();}
}
rateEl.onchange=()=>{audioEl.playbackRate=getRate();};
btnRedetect.onclick=()=>{if(!analyzeBuffer)return;stopAll();cur=-1;applyMode();};
document.querySelectorAll('.mb').forEach(b=>{b.onclick=()=>{mode=b.dataset.m;document.querySelectorAll('.mb').forEach(x=>x.classList.remove('on'));b.classList.add('on');if(analyzeBuffer){stopAll();cur=-1;applyMode();}};});

favCount.textContent=favorites.length;

// ---- セッション保存・復元 ----
function saveSession(){
  if(!currentFilePath) return;
  const t=audioEl.currentTime||lastPlayedTime||0;
  try{
    localStorage.setItem('eng_session', JSON.stringify({
      filePath: currentFilePath,
      fileUrl:  currentFileUrl,
      fileName: fileLabel.textContent,
      time:     t,
      mode:     mode
    }));
  }catch(e){}
}

// フォルダ連続再生の進捗を保存
function saveFolderProgress(){
  if(!folderSiblings.length) return;
  try{
    const folderKey=folderSiblings[0].replace(/[^/\\]+$/,'');
    localStorage.setItem('eng_folder_progress', JSON.stringify({
      folderKey,
      fileIdx: folderPlayMode ? folderPlayIdx : folderIndex,
      segIdx:  folderPlayMode ? folderSegIdx  : 0,
      siblings: folderSiblings
    }));
  }catch(e){}
}

// 30秒ごとに自動保存、ページを閉じる直前にも保存
setInterval(()=>{ saveSession(); saveFolderProgress(); }, 30000);
window.addEventListener('beforeunload', ()=>{ saveSession(); saveFolderProgress(); });

// 起動時に前回セッションを復元
(function restoreSession(){
  try{
    const s=JSON.parse(localStorage.getItem('eng_session')||'null');
    if(!s||!s.filePath||!s.fileUrl) return;
    if(s.mode){
      mode=s.mode;
      document.querySelectorAll('.mb').forEach(b=>{
        b.classList.toggle('on', b.dataset.m===mode);
      });
    }
    const restoreTime=s.time||0;
    if(restoreTime>0) lastPlayedTime=restoreTime;
    if(window.api && window.api.openSibling){
      window.api.openSibling(s.filePath);
    } else {
      currentFilePath=s.filePath;
      loadAudio(s.fileUrl, s.fileName||'前回のファイル');
    }
    if(restoreTime>0){
      const waitAndSeek=()=>{
        audioEl.currentTime=restoreTime;
        curTimeEl.textContent=fmt(restoreTime);
        if(audioDuration) seekFill.style.width=(restoreTime/audioDuration*100)+'%';
        statusMsg.textContent=`前回の続き: ${fmt(restoreTime)} から再開できます ▶ で再生`;
      };
      const orig=audioEl.onloadedmetadata;
      audioEl.onloadedmetadata=()=>{
        if(orig) orig.call(audioEl);
        setTimeout(waitAndSeek, 200);
      };
    }
  }catch(e){}
})();
